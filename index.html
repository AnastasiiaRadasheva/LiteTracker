<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sõnavara kontroll · Hajusrakenduste terminid EE↔RU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow-row"><span class="node-dot"></span> LiteTracker · Random sõnad · client node</div>
    <h1>Sõnavara kontroll: hajusrakenduste terminid</h1>
  </header>

  <div class="board">

    <!-- Osa A: EE -> RU -->
    <div class="node">
      <div class="node-head">
        <h2>Osa A</h2>
        <span class="direction">EE → RU</span>
      </div>
      <div class="word-display" id="wordEE">…</div>
      <div class="answer-row">
        <input type="text" id="inputRU" placeholder="Kirjuta venekeelne vaste" autocomplete="off">
        <button class="btn-check" id="checkEE">Kontrolli</button>
      </div>
      <div class="feedback" id="feedbackEE"></div>
      <button class="btn-refresh" id="refreshEE">Uus sõna ↻</button>
    </div>

    <!-- Osa B: RU -> EE -->
    <div class="node">
      <div class="node-head">
        <h2>Osa B</h2>
        <span class="direction">RU → EE</span>
      </div>
      <div class="word-display" id="wordRU">…</div>
      <div class="answer-row">
        <input type="text" id="inputEE" placeholder="Напиши эстонский эквивалент" autocomplete="off">
        <button class="btn-check" id="checkRU">Проверить</button>
      </div>
      <div class="feedback" id="feedbackRU"></div>
      <button class="btn-refresh" id="refreshRU">Новое слово ↻</button>
    </div>

  </div>

  <footer>build: local session · sõnavara: hajusrakenduste terminoloogia</footer>
</div>

<script src="script.js"></script>
</body>
</html>
